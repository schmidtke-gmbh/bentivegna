# Vorschau auf GitHub Pages: https://schmidtke-gmbh.github.io/bentivegna/
# Baut bei jedem Hochladen auf main und jeden Morgen (für terminierte Artikel).
# Auf der Vorschau verschicken Formulare nichts und /admin/ braucht Netlify. Die Klick-Demo /cms-demo/ funktioniert.
name: Vorschau GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Seite bauen
        run: npm run build
        env:
          BASE: /bentivegna/
          PUBLIC_VORSCHAU: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
