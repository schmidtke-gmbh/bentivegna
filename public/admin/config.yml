# Decap CMS – Konfiguration für die Bentivegna-Website
# Erzeugt aus den Datendateien. Repository-Name unter backend.repo anpassen.
backend:
  name: github
  repo: schmidtke-gmbh/bentivegna-website
  branch: main
  commit_messages:
    create: 'Neu: {{collection}} „{{slug}}“'
    update: 'Geändert: {{collection}} „{{slug}}“'
    delete: 'Gelöscht: {{collection}} „{{slug}}“'
    uploadMedia: 'Bild hochgeladen: {{path}}'
    deleteMedia: 'Bild gelöscht: {{path}}'
publish_mode: editorial_workflow
locale: de
site_url: https://www.bentivegna.de
display_url: https://www.bentivegna.de
logo_url: /uploads/logos/logo-quer.svg
media_folder: public/uploads
public_folder: /uploads
show_preview_links: true
collections:
- name: artikel
  label: Artikel
  label_singular: Artikel
  description: Hier legst du jeden Teil von „Der Chef auf der Baustelle“ an. Liegt das Datum in der Zukunft, geht der Artikel an diesem Tag morgens automatisch online.
  folder: src/content/artikel
  create: true
  extension: md
  format: frontmatter
  slug: '{{url}}'
  identifier_field: titel
  summary: 'Teil {{teil}}: {{titel}} ({{datum | date(''DD.MM.YYYY'')}})'
  sortable_fields:
  - teil
  - datum
  - titel
  preview_path: der-chef-auf-der-baustelle/{{slug}}/
  fields:
  - label: Titel (H1)
    name: titel
    widget: string
  - label: URL-Endung
    name: url
    widget: string
    hint: Kleinbuchstaben und Bindestriche, z. B. der-zustand-deines-betriebs-ist-kein-zufall. Nach der Veröffentlichung nicht mehr ändern.
    pattern:
    - ^[a-z0-9-]+$
    - Nur Kleinbuchstaben, Zahlen und Bindestriche
  - label: Teil-Nummer
    name: teil
    widget: number
    value_type: int
    min: 1
  - label: Kapitel
    name: kapitel
    widget: relation
    collection: kapitel
    search_fields:
    - titel
    value_field: '{{slug}}'
    display_fields:
    - 'Kapitel {{nummer}}: {{titel}}'
  - label: Veröffentlichen am
    name: datum
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD.MM.YYYY
    time_format: false
    hint: Liegt das Datum in der Zukunft, erscheint der Artikel automatisch an diesem Tag.
  - label: Als Entwurf zurückhalten
    name: entwurf
    widget: boolean
    default: false
    required: false
  - label: Einleitung (kursiv unter dem Titel)
    name: lead
    widget: text
    required: false
  - label: Artikelbild (1,91:1, z. B. 1200 × 628 px)
    name: bild
    widget: image
    required: false
    hint: Wird auch als Vorschaubild für LinkedIn, WhatsApp und Facebook genutzt. Ohne Bild erscheint automatisch eine Titelkarte.
  - label: Bildbeschreibung (Alt-Text)
    name: bild_alt
    widget: string
    required: false
  - label: Text
    name: body
    widget: markdown
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - quote
    - bulleted-list
    - numbered-list
    editor_components: []
    hint: Zwischenüberschriften als H2. Texte aus Word einfach einfügen.
  - label: Box „Deine Aufgabe für diese Woche“
    name: aufgabe
    widget: text
    required: false
  - label: Aufgabe vor dem letzten Abschnitt („Wie es weitergeht“) zeigen
    name: aufgabe_vor_ausblick
    widget: boolean
    default: true
    required: false
  - label: Meta-Titel (Google)
    name: meta_titel
    widget: string
    required: false
  - label: Meta-Beschreibung (Google)
    name: meta_beschreibung
    widget: text
    required: false
  - label: Suchbegriff
    name: suchbegriff
    widget: string
    required: false
  - label: Lesezeit in Minuten (leer = automatisch)
    name: lesezeit
    widget: number
    value_type: int
    required: false
  - label: Hörbuch-Datei (MP3, erscheint erst, wenn der Player unter „Übersicht & Einstellungen“ eingeschaltet ist)
    name: audio
    widget: file
    required: false
- name: kapitel
  label: Kapitel
  label_singular: Kapitel
  description: Die Kapitel der Buchreihe. Jeder Artikel gehört zu einem Kapitel.
  folder: src/content/kapitel
  create: true
  extension: json
  format: json
  slug: '{{slug}}'
  identifier_field: titel
  summary: 'Kapitel {{nummer}}: {{titel}}'
  fields:
