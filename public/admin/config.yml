- name: stellen
  label: Offene Stellen
  label_singular: Stelle
  description: Jede Stelle bekommt eine eigene Profilseite. Ist eine Stelle besetzt, schaltest du „Stelle ist aktiv“ aus.
  folder: src/content/stellen
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: titel
  summary: '{{titel}}'
  preview_path: karriere/{{slug}}/
  fields:
  - label: Stellentitel (exakt wie im Stellenprofil)
    name: titel
    widget: string
  - label: Reihenfolge
    name: reihenfolge
    widget: number
    value_type: int
    default: 1
  - label: Stelle ist aktiv
    name: aktiv
    widget: boolean
    default: true
  - label: Umfang
    name: umfang
    widget: string
    default: Vollzeit / Teilzeit
  - label: Ort
    name: ort
    widget: string
    default: Überlingen
  - label: Arbeitsmodell
    name: arbeitsmodell
    widget: string
    default: vor Ort, Homeoffice, Hybrid
  - label: Start
    name: start
    widget: string
    default: ab sofort
  - label: Aufgaben (die ersten drei erscheinen auf der Karriereseite)
    name: aufgaben
    widget: list
    field:
      label: Aufgabe
      name: aufgabe
      widget: string
  - label: Anforderungen (die ersten drei erscheinen auf der Karriereseite)
    name: anforderungen
    widget: list
    field:
      label: Anforderung
      name: anforderung
      widget: string
  - label: Stellenprofil als PDF
    name: profil_pdf
    widget: file
    required: false
  - label: Veröffentlicht am
    name: datum
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD.MM.YYYY
    time_format: false
    required: false
  - label: Vollständiges Stellenprofil
    name: body
    widget: markdown
    required: false
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    editor_components: []
